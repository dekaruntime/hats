name: Delete hats worker

on:
  workflow_dispatch:

jobs:
  delete:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Remove stray hats Worker script
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "Deleting worker script 'hats' from account $CF_ACCOUNT_ID"
          curl -s -X DELETE \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/hats" | jq .
