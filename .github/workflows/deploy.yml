name: Deploy hats.deka.gg

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hats
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build runs the conformance suite against both wasm and the native CLI,
      # so the deployed site includes native/wasm drift detection.
      - name: Build site
        run: bun run build

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy

      - name: Purge Cloudflare edge cache
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -uo pipefail
          ZONE_ID=$(curl -s -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=deka.gg" | jq -r '.result[0].id')
          if [ -z "$ZONE_ID" ] || [ "$ZONE_ID" = "null" ]; then
            echo "::warning::Could not find zone ID for deka.gg; skipping cache purge."
            exit 0
          fi
          echo "Purging zone $ZONE_ID"
          PURGE_RESULT=$(curl -s -X POST -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
            -d '{"purge_everything":true}')
          echo "$PURGE_RESULT" | jq .
          if [ "$(echo "$PURGE_RESULT" | jq -r '.success')" != "true" ]; then
            echo "::warning::Cache purge failed. If the site still looks stale, purge manually from the Cloudflare dashboard or add a CLOUDFLARE_PURGE_TOKEN secret with Zone:Edit scope."
            exit 0
          fi
