name: Native drift check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  native-drift:
    runs-on: [self-hosted, macos, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dump test results with native CLI
        run: bun scripts/dump-results.mjs
